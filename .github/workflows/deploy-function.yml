# 部署下載用 Edge Function（可在手機／iPad 上操作，不需要電腦）
# 需要：
#   Secrets：SUPABASE_ACCESS_TOKEN（Supabase 個人存取權杖）
#   Variables：SUPABASE_PROJECT_REF（專案代碼，即 https://<這段>.supabase.co）
# 第一次執行時會自動產生 DOWNLOAD_TOKEN_SECRET 並只存進 Supabase（不會出現在 GitHub 或紀錄中）。
name: 部署下載功能（Edge Function）

on:
  workflow_dispatch:
    inputs:
      rotate_token_secret:
        description: "重新產生下載授權金鑰（會讓所有粉絲已取得的授權立即失效）"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["supabase/functions/**"]

concurrency:
  group: deploy-function
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: 檢查設定
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error::請先設定 Secret SUPABASE_ACCESS_TOKEN 與 Variable SUPABASE_PROJECT_REF（見 README）"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 設定下載授權金鑰與允許來源
        env:
          ROTATE: ${{ inputs.rotate_token_secret }}
          OWNER: ${{ github.repository_owner }}
          EXTRA_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
        run: |
          if [ "$ROTATE" = "true" ] || ! npx supabase secrets list --project-ref "$PROJECT_REF" | grep -q "DOWNLOAD_TOKEN_SECRET"; then
            SECRET="$(openssl rand -base64 48 | tr -d '\n')"
            echo "::add-mask::$SECRET"
            npx supabase secrets set --project-ref "$PROJECT_REF" DOWNLOAD_TOKEN_SECRET="$SECRET" > /dev/null
            echo "已產生新的 DOWNLOAD_TOKEN_SECRET（只存在 Supabase）"
          else
            echo "DOWNLOAD_TOKEN_SECRET 已存在，沿用"
          fi
          ORIGINS="https://$(echo "$OWNER" | tr '[:upper:]' '[:lower:]').github.io"
          if [ -n "$EXTRA_ORIGINS" ]; then ORIGINS="$ORIGINS,$EXTRA_ORIGINS"; fi
          npx supabase secrets set --project-ref "$PROJECT_REF" ALLOWED_ORIGINS="$ORIGINS" > /dev/null
          echo "ALLOWED_ORIGINS = $ORIGINS"

      - name: 部署 download 函式
        run: npx supabase functions deploy download --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
