# 推送到 main 時自動建置並部署到 GitHub Pages。
# 需要在 GitHub → Settings → Secrets and variables → Actions → Variables 設定：
#   VITE_SUPABASE_URL、VITE_SUPABASE_ANON_KEY（皆為公開值，不是密鑰）
name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 檢查沒有提交私密金鑰
        run: npm run check:secrets
      - name: 單元測試
        run: npm test
      - name: 建置
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          # 自訂網域時，請在 Variables 設定 VITE_BASE_PATH 為 /
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || format('/{0}/', github.event.repository.name) }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::請先在 GitHub Variables 設定 VITE_SUPABASE_URL 與 VITE_SUPABASE_ANON_KEY"
            exit 1
          fi
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
